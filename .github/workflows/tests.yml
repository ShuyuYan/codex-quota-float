name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        python-version: ['3.10', '3.12']
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    defaults:
      run:
        working-directory: ${{ matrix.platform }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r ../requirements.txt
      - run: python -m unittest discover -v
      - run: python app.py --render ../build/${{ matrix.platform }}/preview.png

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest test_release_source -v
      - name: Build and verify source archive
        run: |
          python -c "from release_source import build_release, verify_release; print('Verified source files:', verify_release(build_release(destination='build/release')))"
