name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        python-version: ['3.10', '3.12']
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    defaults:
      run:
        working-directory: ${{ matrix.platform }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r ../requirements.txt
      - run: python -m unittest discover -v
      - run: python app.py --render ../build/${{ matrix.platform }}/preview.png

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - name: Build and verify source archive
        run: |
          python -c "from release_source import build_release, verify_release; print('Verified source files:', verify_release(build_release(destination='build/release')))"
      - uses: actions/upload-artifact@v7
        with:
          name: source-v1.1.2
          path: |
            build/release/codex-quota-float-1.1.2.zip
            build/release/codex-quota-float-1.1.2.zip.sha256
          if-no-files-found: error

  windows-executable:
    runs-on: windows-latest
    needs: [offline-tests, source-package]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            windows/requirements-build.txt
      - run: python -m pip install -r requirements.txt -r windows/requirements-build.txt
      - name: Build and smoke-test standalone Windows executable
        run: python windows/build_exe.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-v1.1.2
          path: |
            release/CodexQuotaFloat-1.1.2-windows-x64.exe
            release/CodexQuotaFloat-1.1.2-windows-x64.exe.sha256
            release/CodexQuotaFloat-1.1.2-windows-x64.zip
            release/CodexQuotaFloat-1.1.2-windows-x64.zip.sha256
            release/codex-quota-float-1.1.2.zip
            release/codex-quota-float-1.1.2.zip.sha256
            release/DEPENDENCY_SOURCES.md
          if-no-files-found: error
          compression-level: 0
